<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-labelledby="title desc">
  <title id="title">Dev Grover — Growth Marketer</title>
  <desc id="desc">A charcoal banner with ivory typography, emerald accents, and an abstract ascending chart. Curiosity. Experimentation. Progress.</desc>
